# Draws the contribution-graph snake for the profile README, daily.
name: Contribution snake

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a62a0&color_dots=#ebedf0,#b6d4ec,#6aa9d9,#2f80c0,#0a62a0
            dist/snake-dark.svg?palette=github-dark&color_snake=#4db0f2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
